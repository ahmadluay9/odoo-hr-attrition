[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odoo-hr-attrition"
version = "0.1.0"
description = "Odoo HR Predictive Flight Risk Modeling & Retention Intelligence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "numba>=0.59.0",
    "lifelines>=0.29.0",
    "shap>=0.45.0",
    "matplotlib>=3.8.0",
    "mlflow>=2.18.0",
    "psycopg2-binary>=2.9.9",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.65.0",
    "plotly>=7.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
